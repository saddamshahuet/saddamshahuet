<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animation Options Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
      background: #0d1117;
      color: #e6edf3;
    }
    .container {
      width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .card h3 {
      margin-top: 0;
      color: #58a6ff;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Rounded Pill + Option 3 Shimmer (Select Icons)</h2>
    <p style="color:#8b949e;">Using the original rounded dark background and glowing animated border, with Option 3 shimmer text.</p>

    <!-- Pair A -->
    <div class="card">
      <h3>Pair A: Live Radar Beacon (●) + Rocket (🚀)</h3>
      <img src="assets/available_custom.svg" alt="Pair A" style="max-width: 100%;" />
    </div>

    <!-- Pair B -->
    <div class="card">
      <h3>Pair B: Tech Lightning (⚡ ... ⚡)</h3>
      <img src="assets/available_lightning.svg" alt="Pair B" style="max-width: 100%;" />
    </div>
  </div>
</body>
</html>
