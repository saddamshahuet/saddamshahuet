<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 52" width="640" height="52">
  <defs>
    <!-- Soft animated border gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" 
          values="#38bdf8; #818cf8; #34d399; #38bdf8" 
          dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" 
          values="#818cf8; #34d399; #38bdf8; #818cf8" 
          dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" 
          values="#34d399; #38bdf8; #818cf8; #34d399" 
          dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16.5px;
        font-weight: 600;
        fill: #f8fafc;
        letter-spacing: 0.4px;
      }
      .sparkle-left {
        transform-origin: 46px 26px;
        animation: sparkle-pulse 2.2s ease-in-out infinite;
      }
      .sparkle-right {
        transform-origin: 594px 26px;
        animation: sparkle-pulse 2.2s ease-in-out 1.1s infinite;
      }
      .sheen {
        animation: sheen-slide 4.5s ease-in-out infinite;
      }
      @keyframes sparkle-pulse {
        0%, 100% {
          transform: scale(0.9) rotate(0deg);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.25) rotate(15deg);
          opacity: 1;
        }
      }
      @keyframes sheen-slide {
        0% { transform: translateX(-640px); opacity: 0; }
        20% { opacity: 0.18; }
        40% { transform: translateX(640px); opacity: 0; }
        100% { transform: translateX(640px); opacity: 0; }
      }
    </style>

    <!-- Moving sheen clip -->
    <clipPath id="pillClip">
      <rect x="2" y="2" width="636" height="48" rx="24" />
    </clipPath>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Pill with subtle soft border glow -->
  <rect x="2" y="2" width="636" height="48" rx="24" fill="#0f172a" stroke="url(#borderGlow)" stroke-width="2" />

  <!-- Subtle Sheen sweep across the pill -->
  <g clip-path="url(#pillClip)">
    <rect class="sheen" x="0" y="0" width="240" height="52" fill="url(#sheenGrad)" />
  </g>

  <!-- Left Sparkle -->
  <g class="sparkle-left">
    <g transform="translate(46, 26)">
      <!-- 4-point star -->
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#fbbf24">
        <animateTransform attributeName="transform" type="scale" values="0.9; 1.25; 0.9" dur="2.2s" repeatCount="indefinite" />
      </path>
      <!-- Small companion star -->
      <path d="M 7,-7 Q 7,-3 11,-3 Q 7,-3 7,1 Q 7,-3 3,-3 Q 7,-3 7,-7 Z" fill="#fde68a" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1.25; 0.8; 1.25" dur="2.2s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <!-- Text - Showing at all times, high contrast, non-pungent -->
  <text x="320" y="32" text-anchor="middle" class="badge-text">
    Available for end-to-end projects &amp; contract work
  </text>

  <!-- Right Sparkle -->
  <g class="sparkle-right">
    <g transform="translate(594, 26)">
      <!-- 4-point star -->
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#fbbf24">
        <animateTransform attributeName="transform" type="scale" values="1.25; 0.9; 1.25" dur="2.2s" repeatCount="indefinite" />
      </path>
      <!-- Small companion star -->
      <path d="M -7,-7 Q -7,-3 -3,-3 Q -7,-3 -7,1 Q -7,-3 -11,-3 Q -7,-3 -7,-7 Z" fill="#fde68a" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="0.8; 1.25; 0.8" dur="2.2s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>
