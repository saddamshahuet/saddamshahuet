<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 48" width="680" height="48">
  <defs>
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="offset" values="-1; 1" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#ffffff">
        <animate attributeName="offset" values="-0.75; 1.25" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="offset" values="-0.5; 1.5" dur="3.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      .shimmer-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.4px;
        fill: url(#textShimmer);
      }
      .sparkle {
        animation: gentleTwinkle 2.5s ease-in-out infinite;
      }
      .sparkle-delay {
        animation: gentleTwinkle 2.5s ease-in-out 1.25s infinite;
      }
      @keyframes gentleTwinkle {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 4px #fbbf24); }
      }
    </style>
  </defs>

  <g transform="translate(340, 28)">
    <text class="sparkle" x="-285" y="0" text-anchor="middle" font-size="18">✨</text>
    <text class="shimmer-text" x="0" y="0" text-anchor="middle">
      Available for end-to-end projects &amp; contract work
    </text>
    <text class="sparkle-delay" x="285" y="0" text-anchor="middle" font-size="18">✨</text>
  </g>
</svg>
